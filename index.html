<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Semak Email Pelajar</title>

<!-- ===== Link preview (Open Graph) ===== -->

<meta name="twitter:card" content="summary_large_image" />

<meta name="twitter:description" content="Masukkan No. IC untuk dapatkan email pelajar anda." />
<meta name="twitter:image" content="https://email-student.pages.dev/preview.png" />
<meta name="theme-color" content="#0d1117" />

<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #2f81f7;
    --accent-hover: #4493f8; --green: #3fb950; --red: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 32px 28px; width: 100%; max-width: 420px; box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  h1 { font-size: 20px; margin-bottom: 6px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; line-height: 1.5; }
  label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--muted); }
  input {
    width: 100%; padding: 11px 13px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 15px; margin-bottom: 16px; transition: border-color .15s;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .msg { font-size: 13px; margin-top: 14px; padding: 10px 12px; border-radius: 8px; display: none; line-height: 1.5; }
  .msg.error { display: block; background: rgba(248,81,73,.12); color: var(--red); border: 1px solid rgba(248,81,73,.3); }
  .result { display: none; margin-top: 20px; padding: 18px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
  .result.show { display: block; }
  .result .name { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .result .field-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .result .email-row { display: flex; gap: 8px; align-items: center; }
  .result .email {
    flex: 1; font-size: 15px; font-weight: 600; word-break: break-all;
    background: var(--panel); padding: 10px 12px; border-radius: 7px; border: 1px solid var(--border);
  }
  .copy-btn { width: auto; padding: 10px 14px; font-size: 13px; white-space: nowrap; background: var(--green); }
  .copy-btn:hover:not(:disabled) { background: #46c75a; }
  .spinner { display: inline-block; width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation: spin .6s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer { text-align: center; font-size: 11px; color: var(--muted); margin-top: 20px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Semak Email Pelajar</h1>
    <p class="sub">Masukkan No. Kad Pengenalan untuk dapatkan email pelajar anda.</p>

    <label for="ic">No. Kad Pengenalan</label>
    <input id="ic" type="text" inputmode="numeric" placeholder="cth: 010203-10-1234" autocomplete="off" />

    <button id="submitBtn">Semak Email</button>

    <div id="msg" class="msg"></div>

    <div id="result" class="result">
      <div class="name" id="resultName"></div>
      <div class="field-label">Email Pelajar</div>
      <div class="email-row">
        <div class="email" id="resultEmail"></div>
        <button class="copy-btn" id="copyBtn">Copy</button>
      </div>
    </div>

    <div class="footer">Data anda tidak disimpan di pelayar ini.</div>
  </div>

<script>
  // ====== CONFIG ======
  const FUNCTION_URL = "https://shulmdrhpwasrbuflejv.supabase.co/functions/v1/lookup-email";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNodWxtZHJocHdhc3JidWZsZWp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3MDkyODgsImV4cCI6MjA5ODI4NTI4OH0.ZxHIfV3Nw8MPy5YVopdeQBP-37VavadDjI7U4jXmGu0";
  // ====================

  const $ = (id) => document.getElementById(id);
  const ic = $("ic"), btn = $("submitBtn");
  const msg = $("msg"), result = $("result");
  const resultName = $("resultName"), resultEmail = $("resultEmail"), copyBtn = $("copyBtn");

  function showError(text) { msg.textContent = text; msg.className = "msg error"; result.className = "result"; }
  function clearMsg() { msg.className = "msg"; msg.textContent = ""; }

  async function lookup() {
    clearMsg();
    result.className = "result";
    const icVal = ic.value.replace(/\D/g, "");
    if (icVal.length !== 12) return showError("No. IC mesti 12 digit.");

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    try {
      const res = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + ANON_KEY },
        body: JSON.stringify({ ic: icVal }),
      });
      const data = await res.json();
      if (!res.ok) return showError(data.error || "Ralat. Cuba lagi.");
      resultName.textContent = data.name || "";
      resultEmail.textContent = data.email;
      result.className = "result show";
      copyBtn.textContent = "Copy";
    } catch {
      showError("Gagal sambung ke pelayan. Semak sambungan internet.");
    } finally {
      btn.disabled = false;
      btn.textContent = "Semak Email";
    }
  }

  btn.addEventListener("click", lookup);
  ic.addEventListener("keydown", (e) => { if (e.key === "Enter") lookup(); });
  copyBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(resultEmail.textContent);
      copyBtn.textContent = "Copied \u2713";
      setTimeout(() => (copyBtn.textContent = "Copy"), 1800);
    } catch { copyBtn.textContent = "Gagal"; }
  });
</script>
</body>
</html>
